<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Photo Stamper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .typewriter-font {
            font-family: 'Special Elite', cursive;
        }

        /* Container for the canvas to maintain aspect ratio and fit screen */
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            aspect-ratio: 1 / 1; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* The actual canvas element */
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .controls-panel {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        input[type="file"] {
            display: none;
        }
        
        .custom-file-upload {
            border: 2px dashed #9ca3af;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
            cursor: pointer;
            border-radius: 0.5rem;
            background-color: #f9fafb;
            color: #4b5563;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
            height: 100%;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .custom-file-upload:hover {
            border-color: #3b82f6;
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: 500;
            color: #374151;
            font-size: 0.875rem;
        }

        .input-group input[type="text"],
        .input-group input[type="date"],
        .input-group input[type="color"],
        .input-group select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 1rem;
        }
        
        .input-group input[type="color"] {
            padding: 0;
            height: 40px;
            cursor: pointer;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
            text-align: center;
            display: inline-block;
        }

        .btn:hover {
            background-color: #2563eb;
        }
        
        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #10b981;
        }

        .btn-secondary:hover {
            background-color: #059669;
        }

        /* Modal specific styles */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-6xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-10">
    
    <!-- Controls Section -->
    <div class="lg:col-span-1 flex flex-col gap-4">
        <h1 class="text-3xl font-bold text-gray-800 mb-2 typewriter-font">Retro Stamper</h1>
        <p class="text-sm text-gray-600 mb-4">Turn your high-resolution photos into retro Polaroid-style prints with typewriter text on the frame.</p>
        
        <div class="controls-panel">
            <!-- File Upload & Camera Buttons -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <!-- Upload File -->
                <label class="custom-file-upload">
                    <input type="file" id="imageLoader" accept="image/*" />
                    <svg class="w-7 h-7 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <span>Upload File</span>
                </label>
                <!-- Take Camera Photo -->
                <button id="openCameraBtn" class="custom-file-upload m-0 outline-none">
                    <svg class="w-7 h-7 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Kamera</span>
                </button>
            </div>

            <!-- Content Inputs -->
            <div class="input-group">
                <label for="dateInput">Date</label>
                <input type="date" id="dateInput" value="">
            </div>
            <div class="input-group">
                <label for="locationInput">Location</label>
                <input type="text" id="locationInput" placeholder="e.g., Jakarta, Indonesia">
            </div>
            <div class="input-group">
                <label for="descInput">Description/Note</label>
                <input type="text" id="descInput" placeholder="A beautiful day...">
            </div>

            <hr class="my-6 border-gray-200">

            <!-- Styling Controls -->
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label for="textColor">Text Color</label>
                    <input type="color" id="textColor" value="#111827">
                </div>
                <div class="input-group">
                    <label for="frameColor">Frame Color</label>
                    <input type="color" id="frameColor" value="#F4F0E6">
                </div>
                
                <div class="input-group">
                    <label for="frameFormat">Ukuran Polaroid (Format)</label>
                    <select id="frameFormat">
                        <option value="classic" selected>Classic Polaroid (Standar)</option>
                        <option value="mini">Instax Mini (Lebih Tinggi)</option>
                        <option value="wide">Instax Wide (Border Lebar)</option>
                        <option value="square">Symmetrical Square (Sama Sisi)</option>
                        <option value="thick">Bold & Thick (Tebal)</option>
                        <option value="thin">Modern Thin (Tipis)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="frameTexture">Gaya Frame (Tekstur)</label>
                    <select id="frameTexture">
                        <option value="paper" selected>Kertas Matte (Standar)</option>
                        <option value="clean">Bersih & Datar (Modern)</option>
                        <option value="stained">Kertas Usang & Bernoda</option>
                        <option value="worn">Tepi Kusam (Worn Edges)</option>
                    </select>
                </div>

                <div class="input-group col-span-2">
                    <label for="vintageFilter">Photo Filter (30 Pilihan)</label>
                    <select id="vintageFilter">
                        <option value="none">None (Original Photo)</option>
                        <optgroup label="NEW: Film & Cinematic">
                            <option value="film_kodak">Film: Kodak Portra 400 (Warm & Soft)</option>
                            <option value="film_fuji">Film: Fuji Superia (Cool & Moody)</option>
                            <option value="film_cinematic">Cinematic: Teal & Orange</option>
                            <option value="film_noir">Cinematic: Noir Classic (Contrast B&W)</option>
                            <option value="film_vhs">Vintage: 90s VHS Camcorder</option>
                        </optgroup>
                        <optgroup label="Retro & Vintage">
                            <option value="light" selected>Light Retro (Faded & Warm)</option>
                            <option value="heavy">Heavy Vintage (High Contrast Sepia)</option>
                            <option value="flash">Disposable Flash (Harsh Light)</option>
                            <option value="bw">Classic B&W (Monochrome)</option>
                            <option value="cool">Cool Film (Cyan Tint)</option>
                            <option value="matte">70s Matte (Washed Out)</option>
                            <option value="lomo">Lomography (Vivid)</option>
                            <option value="warm">Golden Hour (Warm Polaroid)</option>
                            <option value="cyanotype">Cyanotype (Blue Print)</option>
                            <option value="fadedbw">Faded B&W (Old Newspaper)</option>
                            <option value="pastel">Pastel Dream (Soft Pink)</option>
                            <option value="grunge">90s Grunge (Desaturated)</option>
                            <option value="negative">Color Negative (Inverted)</option>
                            <option value="cyberpunk">Cyberpunk (Neon Tint)</option>
                            <option value="denim">Washed Denim (Faded Blue)</option>
                            <option value="crimson">Crimson Red (Dark Red)</option>
                            <option value="amber">Amber Glow (Orange)</option>
                            <option value="emerald">Emerald Forest (Green)</option>
                            <option value="overexposed">Overexposed (Bright)</option>
                            <option value="pinhole">Pinhole Camera (Dark)</option>
                        </optgroup>
                        <optgroup label="Pro Studio">
                            <option value="pro_studio">Pro: Studio Portrait</option>
                            <option value="pro_cinematic">Pro: Cinematic Classic</option>
                            <option value="pro_landscape">Pro: Landscape Enhancer</option>
                            <option value="pro_bw">Pro: Fine Art B&W</option>
                            <option value="pro_commercial">Pro: Commercial Punchy</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label for="vignetteIntensity">Vignette (Dark Edges)</label>
                    <input type="range" id="vignetteIntensity" min="0" max="0.8" step="0.1" value="0.4" class="w-full">
                </div>
                <div class="input-group">
                    <label for="grainIntensity">Film Grain (Noise)</label>
                    <input type="range" id="grainIntensity" min="0" max="60" step="5" value="25" class="w-full">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label for="textAlign">Text Alignment</label>
                    <select id="textAlign">
                        <option value="left">Left</option>
                        <option value="center" selected>Center</option>
                        <option value="right">Right</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="textShadow">Text Effect</label>
                    <select id="textShadow">
                        <option value="none" selected>None</option>
                        <option value="light">Light Glow</option>
                        <option value="dark">Dark Shadow</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                 <label for="fontSizeScale">Font Size Scale</label>
                 <input type="range" id="fontSizeScale" min="0.5" max="3" step="0.1" value="1" class="w-full">
            </div>

            <div class="mt-6">
                <button id="downloadBtn" class="btn btn-secondary" disabled>
                    Download Full-Res Image
                </button>
            </div>
        </div>
    </div>

    <!-- Preview Section -->
    <div class="lg:col-span-2 flex flex-col">
        <h2 class="text-xl font-semibold text-gray-700 mb-4">Preview</h2>
        <div id="canvas-container">
            <p id="placeholder-text" class="text-gray-500 text-center absolute w-full z-10 pointer-events-none">Upload an image or take a photo to start editing</p>
            <canvas id="imageCanvas"></canvas>
        </div>
        <p class="text-xs text-gray-500 mt-2 text-center">Preview is scaled down. Downloaded image retains original resolution.</p>
    </div>

</div>

<!-- Camera Modal (Hidden by default) -->
<div id="cameraModal" class="hidden fixed inset-0 z-50 modal-overlay flex flex-col items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-4 flex flex-col items-center">
        <div class="w-full flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-gray-800">Ambil Foto</h3>
            <button id="closeCameraBtnX" class="text-gray-500 hover:text-gray-800 p-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <p id="cameraErrorText" class="hidden w-full p-3 mb-4 bg-red-100 text-red-700 rounded-lg text-sm text-center">
            <!-- Error message will be injected here if camera access fails -->
        </p>

        <!-- Video stream area -->
        <div class="w-full bg-black rounded-lg overflow-hidden mb-4 relative flex items-center justify-center" style="min-height: 40vh; max-height: 60vh;">
            <video id="cameraVideo" class="w-full h-full object-cover" autoplay playsinline></video>
        </div>

        <div class="flex gap-4 w-full">
            <button id="captureBtn" class="btn bg-blue-600 hover:bg-blue-700 flex-1 flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                Snap Photo
            </button>
            <button id="closeCameraBtn" class="btn bg-gray-500 hover:bg-gray-600 flex-none w-auto">Batal</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- Elements ---
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvas-container');
        const placeholderText = document.getElementById('placeholder-text');
        
        // Camera Elements
        const openCameraBtn = document.getElementById('openCameraBtn');
        const cameraModal = document.getElementById('cameraModal');
        const cameraVideo = document.getElementById('cameraVideo');
        const captureBtn = document.getElementById('captureBtn');
        const closeCameraBtn = document.getElementById('closeCameraBtn');
        const closeCameraBtnX = document.getElementById('closeCameraBtnX');
        const cameraErrorText = document.getElementById('cameraErrorText');

        // Inputs
        const dateInput = document.getElementById('dateInput');
        const locationInput = document.getElementById('locationInput');
        const descInput = document.getElementById('descInput');
        
        // Styling Inputs
        const textColorInput = document.getElementById('textColor');
        const frameColorInput = document.getElementById('frameColor');
        const frameFormatInput = document.getElementById('frameFormat');
        const frameTextureInput = document.getElementById('frameTexture');
        const vintageFilterInput = document.getElementById('vintageFilter');
        const vignetteIntensityInput = document.getElementById('vignetteIntensity');
        const grainIntensityInput = document.getElementById('grainIntensity');
        const textAlignInput = document.getElementById('textAlign');
        const textShadowInput = document.getElementById('textShadow');
        const fontSizeScaleInput = document.getElementById('fontSizeScale');
        
        const downloadBtn = document.getElementById('downloadBtn');

        // --- State ---
        let currentImage = null;
        let originalWidth = 0;
        let originalHeight = 0;
        let cameraStream = null;

        // Set default date to today
        const today = new Date();
        const yyyy = today.getFullYear();
        let mm = today.getMonth() + 1; 
        let dd = today.getDate();
        if (dd < 10) dd = '0' + dd;
        if (mm < 10) mm = '0' + mm;
        dateInput.value = `${yyyy}-${mm}-${dd}`;

        // --- Event Listeners ---
        imageLoader.addEventListener('change', handleImageUpload, false);
        
        const inputsToWatch = [
            dateInput, locationInput, descInput, 
            textColorInput, frameColorInput, frameFormatInput, frameTextureInput, vintageFilterInput, 
            vignetteIntensityInput, grainIntensityInput,
            textAlignInput, textShadowInput, fontSizeScaleInput
        ];
        
        inputsToWatch.forEach(input => {
            input.addEventListener('input', drawImageOnCanvas);
        });

        downloadBtn.addEventListener('click', downloadImage);

        // --- Camera Handling ---
        openCameraBtn.addEventListener('click', async () => {
            cameraModal.classList.remove('hidden');
            cameraErrorText.classList.add('hidden');
            try {
                // Request back camera if on mobile, fallback to any available
                cameraStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } 
                });
                cameraVideo.srcObject = cameraStream;
            } catch (err) {
                // No alert used! Show message in modal.
                cameraErrorText.textContent = "Kamera tidak dapat diakses. Mohon periksa izin browser atau perangkat Anda.";
                cameraErrorText.classList.remove('hidden');
            }
        });

        function closeCameraModal() {
            cameraModal.classList.add('hidden');
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
        }

        closeCameraBtn.addEventListener('click', closeCameraModal);
        closeCameraBtnX.addEventListener('click', closeCameraModal);

        captureBtn.addEventListener('click', () => {
            if (!cameraStream) return;
            
            // Render video frame to a temporary canvas
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = cameraVideo.videoWidth;
            tempCanvas.height = cameraVideo.videoHeight;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(cameraVideo, 0, 0);
            
            // Load it as our working image
            const img = new Image();
            img.onload = function() {
                currentImage = img;
                originalWidth = img.width;
                originalHeight = img.height;
                
                canvas.width = originalWidth;
                canvas.height = originalHeight;
                
                canvasContainer.style.aspectRatio = `${originalWidth} / ${originalHeight}`;
                placeholderText.style.display = 'none';
                downloadBtn.disabled = false;
                
                drawImageOnCanvas();
            };
            img.src = tempCanvas.toDataURL('image/jpeg', 1.0);
            
            closeCameraModal();
        });

        // --- Functions ---
        function handleImageUpload(e) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    originalWidth = img.width;
                    originalHeight = img.height;
                    
                    canvas.width = originalWidth;
                    canvas.height = originalHeight;
                    
                    canvasContainer.style.aspectRatio = `${originalWidth} / ${originalHeight}`;
                    placeholderText.style.display = 'none';
                    downloadBtn.disabled = false;
                    
                    drawImageOnCanvas();
                }
                img.src = event.target.result;
            }
            if (e.target.files && e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function drawImageOnCanvas() {
            if (!currentImage) return;

            // 1. Calculate Polaroid Dimensions
            const maxDim = Math.max(originalWidth, originalHeight);
            
            let borderSideRatio = 0.05;
            let borderBottomRatio = 0.20;
            const format = frameFormatInput.value;

            if (format === 'mini') { borderSideRatio = 0.07; borderBottomRatio = 0.28; }
            else if (format === 'wide') { borderSideRatio = 0.04; borderBottomRatio = 0.15; }
            else if (format === 'square') { borderSideRatio = 0.05; borderBottomRatio = 0.05; }
            else if (format === 'thick') { borderSideRatio = 0.09; borderBottomRatio = 0.25; }
            else if (format === 'thin') { borderSideRatio = 0.02; borderBottomRatio = 0.08; }

            const borderSide = maxDim * borderSideRatio;
            const borderBottom = maxDim * borderBottomRatio;

            canvas.width = originalWidth + (borderSide * 2);
            canvas.height = originalHeight + borderSide + borderBottom;

            // 2. Draw Frame & Textures
            ctx.fillStyle = frameColorInput.value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const texture = frameTextureInput.value;
            
            if (texture !== 'clean') {
                const frameGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                frameGrad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
                frameGrad.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
                frameGrad.addColorStop(1, 'rgba(0, 0, 0, 0.04)');
                ctx.fillStyle = frameGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (texture === 'stained') {
                const stain = ctx.createRadialGradient(0, 0, 0, 0, 0, maxDim * 0.6);
                stain.addColorStop(0, 'rgba(139, 69, 19, 0.12)'); 
                stain.addColorStop(1, 'rgba(139, 69, 19, 0)');
                ctx.fillStyle = stain;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                const stain2 = ctx.createRadialGradient(canvas.width, canvas.height, 0, canvas.width, canvas.height, maxDim * 0.5);
                stain2.addColorStop(0, 'rgba(101, 67, 33, 0.15)');
                stain2.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = stain2;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            if (texture === 'worn') {
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = Math.max(5, maxDim * 0.015);
                ctx.strokeRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = Math.max(2, maxDim * 0.005);
                ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, canvas.width - ctx.lineWidth*2, canvas.height - ctx.lineWidth*2);
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.08)';
            ctx.lineWidth = Math.max(1, maxDim * 0.002);
            ctx.strokeRect(0, 0, canvas.width, canvas.height);

            // 3. Draw Image with Filters (Now includes 5 New Cinematic/Film Styles)
            ctx.save();
            const filterType = vintageFilterInput.value;
            let overlayColor = null;
            let hasFlashOverlay = false;

            switch(filterType) {
                // --- NEW 5 FILM/CINEMATIC FILTERS ---
                case 'film_kodak': ctx.filter = 'contrast(1.05) saturate(1.2) sepia(0.25) brightness(1.05)'; overlayColor = 'rgba(255, 180, 100, 0.08)'; break;
                case 'film_fuji': ctx.filter = 'contrast(1.15) saturate(1.1) brightness(1.02)'; overlayColor = 'rgba(0, 200, 120, 0.06)'; break;
                case 'film_cinematic': ctx.filter = 'contrast(1.2) saturate(1.25) sepia(0.15)'; overlayColor = 'rgba(0, 120, 150, 0.12)'; break;
                case 'film_noir': ctx.filter = 'grayscale(1) contrast(1.6) brightness(0.9)'; overlayColor = 'rgba(20, 20, 20, 0.1)'; break;
                case 'film_vhs': ctx.filter = 'contrast(0.9) saturate(0.7) sepia(0.1)'; overlayColor = 'rgba(255, 0, 180, 0.07)'; break;
                // ------------------------------------
                case 'light': ctx.filter = 'sepia(0.3) contrast(1.1) brightness(0.95) saturate(0.85)'; break;
                case 'heavy': ctx.filter = 'sepia(0.6) contrast(1.25) brightness(0.9) saturate(0.6)'; break;
                case 'flash': ctx.filter = 'contrast(1.35) brightness(1.1) saturate(1.15) sepia(0.1)'; hasFlashOverlay = true; break;
                case 'bw': ctx.filter = 'grayscale(1) contrast(1.25) brightness(0.95)'; break;
                case 'cool': ctx.filter = 'contrast(1.15) brightness(0.95) saturate(0.75)'; overlayColor = 'rgba(0, 50, 90, 0.15)'; break;
                case 'matte': ctx.filter = 'sepia(0.2) contrast(0.85) brightness(1.1) saturate(0.75)'; overlayColor = 'rgba(120, 80, 50, 0.1)'; break;
                case 'lomo': ctx.filter = 'contrast(1.4) saturate(1.5) brightness(0.95)'; overlayColor = 'rgba(50, 100, 0, 0.1)'; break;
                case 'warm': ctx.filter = 'sepia(0.3) contrast(1.1) saturate(1.2)'; overlayColor = 'rgba(255, 120, 0, 0.15)'; break;
                case 'cyanotype': ctx.filter = 'sepia(1) hue-rotate(180deg) contrast(1.5) brightness(0.9)'; overlayColor = 'rgba(0, 50, 100, 0.2)'; break;
                case 'fadedbw': ctx.filter = 'grayscale(1) contrast(0.7) brightness(1.15)'; break;
                case 'pastel': ctx.filter = 'contrast(0.85) brightness(1.1) saturate(1.3)'; overlayColor = 'rgba(255, 182, 193, 0.15)'; break;
                case 'grunge': ctx.filter = 'contrast(1.2) saturate(0.6) sepia(0.3)'; overlayColor = 'rgba(85, 107, 47, 0.15)'; break;
                case 'negative': ctx.filter = 'invert(1) contrast(1.1)'; break;
                case 'cyberpunk': ctx.filter = 'contrast(1.3) saturate(1.5)'; overlayColor = 'rgba(255, 0, 255, 0.12)'; break;
                case 'denim': ctx.filter = 'grayscale(0.4) contrast(0.8) brightness(1.1)'; overlayColor = 'rgba(0, 0, 128, 0.15)'; break;
                case 'crimson': ctx.filter = 'grayscale(1) contrast(1.2)'; overlayColor = 'rgba(139, 0, 0, 0.3)'; break;
                case 'amber': ctx.filter = 'sepia(1) saturate(2) contrast(1.1)'; overlayColor = 'rgba(255, 140, 0, 0.15)'; break;
                case 'emerald': ctx.filter = 'contrast(1.1) saturate(1.2) sepia(0.2)'; overlayColor = 'rgba(0, 128, 0, 0.15)'; break;
                case 'overexposed': ctx.filter = 'brightness(1.4) contrast(0.85) saturate(0.8)'; break;
                case 'pinhole': ctx.filter = 'contrast(1.5) brightness(0.9) saturate(0.5)'; overlayColor = 'rgba(50, 20, 0, 0.2)'; break;
                case 'pro_studio': ctx.filter = 'brightness(1.05) contrast(0.95) saturate(1.05)'; overlayColor = 'rgba(255, 230, 200, 0.05)'; break;
                case 'pro_cinematic': ctx.filter = 'contrast(1.15) saturate(1.2) sepia(0.1)'; overlayColor = 'rgba(0, 80, 120, 0.15)'; break;
                case 'pro_landscape': ctx.filter = 'contrast(1.15) saturate(1.35) brightness(1.05)'; break;
                case 'pro_bw': ctx.filter = 'grayscale(1) contrast(1.3) brightness(1.1)'; break;
                case 'pro_commercial': ctx.filter = 'contrast(1.1) brightness(1.1) saturate(1.15)'; break;
                default: ctx.filter = 'none';
            }
            
            ctx.drawImage(currentImage, borderSide, borderSide, originalWidth, originalHeight);
            ctx.restore();

            // Filters and Vignette overlays
            if (overlayColor) {
                ctx.fillStyle = overlayColor;
                ctx.fillRect(borderSide, borderSide, originalWidth, originalHeight);
            }

            if (hasFlashOverlay) {
                const centerX = borderSide + (originalWidth / 2);
                const centerY = borderSide + (originalHeight / 2);
                const maxRadius = Math.max(originalWidth, originalHeight) * 0.7;
                const flashGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
                flashGrad.addColorStop(0, 'rgba(255, 255, 255, 0.35)'); 
                flashGrad.addColorStop(0.3, 'rgba(255, 255, 255, 0.08)');
                flashGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = flashGrad;
                ctx.fillRect(borderSide, borderSide, originalWidth, originalHeight);
                ctx.restore();
            }

            const vigIntensity = parseFloat(vignetteIntensityInput.value);
            if (vigIntensity > 0) {
                const centerX = borderSide + (originalWidth / 2);
                const centerY = borderSide + (originalHeight / 2);
                const radius = Math.max(originalWidth, originalHeight) * 0.7;
                
                const vignette = ctx.createRadialGradient(centerX, centerY, radius * 0.3, centerX, centerY, radius);
                vignette.addColorStop(0, 'rgba(0,0,0,0)');
                vignette.addColorStop(1, `rgba(0, 0, 0, ${vigIntensity})`);
                
                ctx.fillStyle = vignette;
                ctx.fillRect(borderSide, borderSide, originalWidth, originalHeight);
            }

            const grainAlpha = parseInt(grainIntensityInput.value);
            if (grainAlpha > 0) {
                const patternSize = 128;
                const patternCanvas = document.createElement('canvas');
                patternCanvas.width = patternSize;
                patternCanvas.height = patternSize;
                const pCtx = patternCanvas.getContext('2d');
                const imgData = pCtx.createImageData(patternSize, patternSize);
                const data = imgData.data;
                
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i]     = val; // R
                    data[i + 1] = val; // G
                    data[i + 2] = val; // B
                    data[i + 3] = grainAlpha; // Alpha
                }
                pCtx.putImageData(imgData, 0, 0);
                
                ctx.save();
                ctx.globalCompositeOperation = 'overlay'; 
                ctx.fillStyle = ctx.createPattern(patternCanvas, 'repeat');
                ctx.fillRect(borderSide, borderSide, originalWidth, originalHeight);
                ctx.restore();
            }

            // Inset borders for depth
            ctx.strokeStyle = 'rgba(0,0,0,0.18)';
            ctx.lineWidth = Math.max(2, maxDim * 0.003);
            ctx.strokeRect(borderSide, borderSide, originalWidth, originalHeight);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = Math.max(1, maxDim * 0.0015);
            ctx.beginPath();
            ctx.moveTo(borderSide, borderSide + originalHeight);
            ctx.lineTo(borderSide, borderSide);
            ctx.lineTo(borderSide + originalWidth, borderSide);
            ctx.stroke();

            // 4. Gather & Draw Text
            let dateStr = "";
            if (dateInput.value) {
                const d = new Date(dateInput.value);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                dateStr = `${year}.${month}.${day}`; 
            }

            const locationStr = locationInput.value.trim();
            const descStr = descInput.value.trim();

            const lines = [];
            if (dateStr) lines.push(dateStr);
            if (locationStr) lines.push(locationStr);
            if (descStr) lines.push(descStr);

            if (lines.length === 0) return;

            const scaleFactor = parseFloat(fontSizeScaleInput.value);
            const baseFontSize = (canvas.width * 0.03) * scaleFactor;
            
            ctx.font = `${baseFontSize}px 'Special Elite', monospace`;
            ctx.fillStyle = textColorInput.value;
            ctx.textBaseline = 'middle';

            const shadowType = textShadowInput.value;
            if (shadowType === 'dark') {
                ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
                ctx.shadowBlur = baseFontSize * 0.1;
                ctx.shadowOffsetX = baseFontSize * 0.02;
                ctx.shadowOffsetY = baseFontSize * 0.02;
            } else if (shadowType === 'light') {
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                ctx.shadowBlur = baseFontSize * 0.1;
                ctx.shadowOffsetX = baseFontSize * 0.02;
                ctx.shadowOffsetY = baseFontSize * 0.02;
            } else {
                ctx.shadowColor = "transparent";
            }

            const align = textAlignInput.value;
            const marginX = canvas.width * 0.08; 
            const lineHeight = baseFontSize * 1.3;
            const totalTextHeight = lines.length * lineHeight;
            
            const bottomAreaCenterY = originalHeight + borderSide + (borderBottom / 2);
            const startY = bottomAreaCenterY - (totalTextHeight / 2) + (lineHeight / 2);

            let startX;
            ctx.textAlign = align;

            if (align === 'left') {
                startX = marginX;
            } else if (align === 'right') {
                startX = canvas.width - marginX;
            } else {
                startX = canvas.width / 2;
            }

            lines.forEach((line, index) => {
                const currentY = startY + (index * lineHeight);
                ctx.fillText(line, startX, currentY);
            });
            
            ctx.shadowColor = "transparent";
        }

        function downloadImage() {
            if (!currentImage) return;
            const dataURL = canvas.toDataURL('image/jpeg', 0.95);
            const link = document.createElement('a');
            const d = new Date();
            const timeStamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${d.getHours()}${d.getMinutes()}`;
            link.download = `stamped_photo_${timeStamp}.jpg`;
            
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });
</script>

</body>
